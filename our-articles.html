<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Articles have moved — Batra Deepak &amp; Associates</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://bdaca.com/knowledge-centre.html#articles" />
  <link rel="icon" href="assets/logo.png" />
  <meta http-equiv="refresh" content="0; url=knowledge-centre.html#articles" />
  <style>
    :root { --ink:#1B1B19; --ink-2:#33332F; --accent:#6E2436; --paper:#F2F2EF; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family: Verdana, Geneva, "DejaVu Sans", sans-serif;
      background: var(--paper); color: var(--ink-2);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px; text-align:center;
    }
    .box { max-width: 46ch; }
    img { height:46px; width:auto; margin:0 auto 22px; display:block; }
    .rule { width:48px; height:3px; background:var(--accent); margin:0 auto 20px; }
    h1 { font-size:21px; line-height:1.4; color:var(--ink); margin-bottom:12px; }
    p { font-size:15px; line-height:1.7; margin-bottom:22px; }
    a.btn {
      display:inline-block; text-decoration:none;
      background: var(--accent); color:#fff;
      font-size:12.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
      padding:12px 22px;
      transition: background .2s;
    }
    a.btn:hover { background: var(--ink); }
    a.btn:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="assets/logo.png" alt="Batra Deepak &amp; Associates" />
    <div class="rule"></div>
    <h1>Our articles now live in the Knowledge Centre</h1>
    <p>You are being taken there now. If nothing happens, use the button below.</p>
    <a class="btn" href="knowledge-centre.html#articles">Go to the Knowledge Centre</a>
  </div>
</body>
</html>
